<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – GMP Workforce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1a2e5a;
  --navy-dark: #0f1e3d;
  --green: #3a8c2f;
  --green-light: #5cba4a;
  --green-pale: #e8f5e5;
  --white: #ffffff;
  --off-white: #f7f9fc;
  --light-gray: #edf0f5;
  --border: #dce3ed;
  --mid-gray: #8a96a8;
  --dark-gray: #3d4a5c;
  --red: #dc3545;
  --red-light: #fbe9eb;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow: 0 4px 24px rgba(26,46,90,0.10);
  --transition: 0.2s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Lato', sans-serif; background: var(--off-white); color: var(--dark-gray); }
h1, h2, h3, h4 { font-family: 'Barlow', sans-serif; font-weight: 700; color: var(--navy); }
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

/* Header */
.header { background: var(--navy-dark); color: white; padding: 18px 0; }
.header .container { display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 1.4rem; color: white; }
.header h1 span { color: var(--green-light); }
.header a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.88rem; transition: color var(--transition); }
.header a:hover { color: white; }

/* Login */
.login-box {
  max-width: 400px; margin: 120px auto; background: white;
  border-radius: var(--radius-lg); padding: 48px 36px; box-shadow: var(--shadow);
  text-align: center;
}
.login-box h2 { margin-bottom: 8px; }
.login-box p { color: var(--mid-gray); font-size: 0.9rem; margin-bottom: 28px; }
.login-box input {
  width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
  border-radius: var(--radius); font-size: 0.95rem; margin-bottom: 18px;
  outline: none; transition: border-color var(--transition);
}
.login-box input:focus { border-color: var(--navy); }
.login-box .error { color: var(--red); font-size: 0.85rem; margin-bottom: 12px; display: none; }
.btn {
  font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 0.9rem;
  text-transform: uppercase; letter-spacing: 0.06em; padding: 12px 28px;
  border-radius: var(--radius); border: none; cursor: pointer; transition: all var(--transition);
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary { background: var(--navy); color: white; width: 100%; justify-content: center; }
.btn-primary:hover { background: var(--navy-dark); }
.btn-green { background: var(--green); color: white; }
.btn-green:hover { background: var(--green-light); }
.btn-red { background: var(--red); color: white; }
.btn-red:hover { background: #b02a37; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--dark-gray); }
.btn-outline:hover { border-color: var(--navy); color: var(--navy); }
.btn-sm { padding: 8px 16px; font-size: 0.8rem; }

/* Dashboard (hidden until login) */
.dashboard { display: none; }
.stats-bar {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 28px 0;
}
.stat-card {
  background: white; border-radius: var(--radius-lg); padding: 24px; border: 1px solid var(--border); text-align: center;
}
.stat-card .num { font-family: 'Barlow', sans-serif; font-weight: 800; font-size: 2rem; color: var(--navy); }
.stat-card .lbl { font-size: 0.82rem; color: var(--mid-gray); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }

.toolbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
}
.toolbar h2 { font-size: 1.2rem; }

.jobs-table {
  width: 100%; border-collapse: collapse; background: white;
  border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow);
}
.jobs-table th {
  background: var(--navy); color: white; font-family: 'Barlow', sans-serif;
  font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 14px 16px; text-align: left;
}
.jobs-table td {
  padding: 14px 16px; font-size: 0.88rem; border-bottom: 1px solid var(--border); vertical-align: middle;
}
.jobs-table tr:last-child td { border-bottom: none; }
.jobs-table tr:hover td { background: var(--off-white); }
.tag {
  display: inline-flex; align-items: center; gap: 5px; font-family: 'Barlow', sans-serif;
  font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
  padding: 4px 10px; border-radius: 100px;
}
.tag-immediate { background: var(--green-pale); color: var(--green); }
.tag-ongoing { background: #e8f0fe; color: #2a5298; }
.tag-inactive { background: var(--light-gray); color: var(--mid-gray); }
.actions { display: flex; gap: 6px; }
.vacancy-badge {
  font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 0.85rem;
}
.empty-state { text-align: center; padding: 48px 24px; color: var(--mid-gray); }
.empty-state p { font-size: 0.95rem; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: white; border-radius: var(--radius-lg); padding: 36px;
  width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
}
.modal h3 { font-size: 1.2rem; margin-bottom: 6px; }
.modal .sub { font-size: 0.88rem; color: var(--mid-gray); margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 0.8rem; color: var(--dark-gray); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius); font-size: 0.92rem; outline: none; background: var(--off-white);
  transition: border-color var(--transition);
}
.form-group input:focus, .form-group select:focus { border-color: var(--navy); background: white; }
.form-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
.modal-close { position: absolute; top: 16px; right: 20px; font-size: 1.4rem; cursor: pointer; color: var(--mid-gray); background: none; border: none; }

/* Loading / Toast */
.toast {
  position: fixed; bottom: 28px; right: 28px; background: var(--navy-dark); color: white;
  padding: 14px 22px; border-radius: var(--radius); font-size: 0.9rem;
  box-shadow: var(--shadow); display: none; z-index: 2000;
}
.toast.show { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="header">
  <div class="container">
    <h1>GMP <span>Workforce</span> Admin</h1>
    <a href="/">← View Site</a>
  </div>
</div>

<div class="container">
  <!-- Login -->
  <div class="login-box" id="loginBox">
    <h2>Admin Login</h2>
    <p>Enter password to manage job listings</p>
    <input type="password" id="passwordInput" placeholder="Admin password" onkeydown="if(event.key==='Enter')login()">
    <div class="error" id="loginError">Incorrect password</div>
    <button class="btn btn-primary" onclick="login()">Login</button>
  </div>

  <!-- Dashboard -->
  <div class="dashboard" id="dashboard">
    <div class="stats-bar">
      <div class="stat-card"><div class="num" id="totalJobs">0</div><div class="lbl">Total Jobs</div></div>
      <div class="stat-card"><div class="num" id="activeJobs">0</div><div class="lbl">Active Jobs</div></div>
      <div class="stat-card"><div class="num" id="totalVacancies">0</div><div class="lbl">Total Vacancies</div></div>
    </div>

    <div class="toolbar">
      <h2>Job Listings</h2>
      <button class="btn btn-green" onclick="openAddModal()">+ Add Job</button>
    </div>

    <table class="jobs-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Type</th>
          <th>Location</th>
          <th>Employment</th>
          <th>Vacancies</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="jobsBody"></tbody>
    </table>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="jobModal">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3 id="modalTitle">Add Job</h3>
    <p class="sub" id="modalSub">Fill in the details to add a new job listing</p>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>Job Title *</label>
      <input type="text" id="jobTitle" placeholder="e.g. Production Operator – OSD Manufacturing">
    </div>
    <div class="form-group">
      <label>Job Type *</label>
      <select id="jobType">
        <option value="immediate">Immediate Joining</option>
        <option value="ongoing">Ongoing</option>
      </select>
    </div>
    <div class="form-group">
      <label>Location *</label>
      <input type="text" id="jobLocation" placeholder="e.g. Hyderabad, TS">
    </div>
    <div class="form-group">
      <label>Employment Type *</label>
      <input type="text" id="jobEmploymentType" placeholder="e.g. Full-Time Contract">
    </div>
    <div class="form-group">
      <label>Number of Vacancies *</label>
      <input type="number" id="jobVacancies" placeholder="e.g. 10" min="0">
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="saveJob()">Save Job</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
let token = localStorage.getItem('adminToken');
let jobs = [];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = token;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { token = null; localStorage.removeItem('adminToken'); showLogin(); return null; }
  return res.json();
}

function showLogin() {
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
}

function showDashboard() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

async function login() {
  const password = document.getElementById('passwordInput').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  if (res.ok) {
    const data = await res.json();
    token = data.token;
    localStorage.setItem('adminToken', token);
    document.getElementById('loginError').style.display = 'none';
    showDashboard();
    loadJobs();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

async function loadJobs() {
  const data = await api('/api/jobs?all=true');
  if (!data) return;
  jobs = data;
  updateStats();
  renderTable();
}

function updateStats() {
  document.getElementById('totalJobs').textContent = jobs.length;
  document.getElementById('activeJobs').textContent = jobs.filter(j => j.active !== false).length;
  document.getElementById('totalVacancies').textContent = jobs.reduce((s, j) => s + (j.active !== false ? j.vacancies : 0), 0);
}

function renderTable() {
  const tbody = document.getElementById('jobsBody');
  if (jobs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><p>No jobs yet. Click "Add Job" to create one.</p></div></td></tr>';
    return;
  }
  tbody.innerHTML = jobs.map(j => {
    const active = j.active !== false;
    const typeClass = active ? (j.type === 'immediate' ? 'tag-immediate' : 'tag-ongoing') : 'tag-inactive';
    const typeLabel = active ? (j.type === 'immediate' ? '● Immediate Joining' : '● Ongoing') : 'Inactive';
    return `<tr>
      <td style="font-weight:600;color:var(--mid-gray)">${j.id}</td>
      <td style="font-weight:600;color:var(--navy)">${escHtml(j.title)}</td>
      <td><span class="tag ${typeClass}">${typeLabel}</span></td>
      <td>${escHtml(j.location)}</td>
      <td>${escHtml(j.employmentType)}</td>
      <td><span class="vacancy-badge">${j.vacancies}</span></td>
      <td>${active ? '<span style="color:var(--green);font-weight:600">Active</span>' : '<span style="color:var(--mid-gray)">Inactive</span>'}</td>
      <td><div class="actions">
        <button class="btn btn-outline btn-sm" onclick="openEditModal(${j.id})">Edit</button>
        <button class="btn btn-red btn-sm" onclick="deleteJob(${j.id})">Delete</button>
      </div></td>
    </tr>`;
  }).join('');
}

function escHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function openAddModal() {
  document.getElementById('modalTitle').textContent = 'Add Job';
  document.getElementById('modalSub').textContent = 'Fill in the details to add a new job listing';
  document.getElementById('editId').value = '';
  document.getElementById('jobTitle').value = '';
  document.getElementById('jobType').value = 'immediate';
  document.getElementById('jobLocation').value = '';
  document.getElementById('jobEmploymentType').value = '';
  document.getElementById('jobVacancies').value = '';
  document.getElementById('modalSaveBtn').textContent = 'Save Job';
  document.getElementById('jobModal').classList.add('open');
}

function openEditModal(id) {
  const j = jobs.find(x => x.id === id);
  if (!j) return;
  document.getElementById('modalTitle').textContent = 'Edit Job';
  document.getElementById('modalSub').textContent = 'Update the job listing details';
  document.getElementById('editId').value = id;
  document.getElementById('jobTitle').value = j.title;
  document.getElementById('jobType').value = j.type;
  document.getElementById('jobLocation').value = j.location;
  document.getElementById('jobEmploymentType').value = j.employmentType;
  document.getElementById('jobVacancies').value = j.vacancies;
  document.getElementById('modalSaveBtn').textContent = 'Update Job';
  document.getElementById('jobModal').classList.add('open');
}

function closeModal() {
  document.getElementById('jobModal').classList.remove('open');
}

async function saveJob() {
  const title = document.getElementById('jobTitle').value.trim();
  const type = document.getElementById('jobType').value;
  const location = document.getElementById('jobLocation').value.trim();
  const employmentType = document.getElementById('jobEmploymentType').value.trim();
  const vacancies = document.getElementById('jobVacancies').value;
  const editId = document.getElementById('editId').value;

  if (!title || !location || !employmentType || !vacancies) {
    showToast('Please fill in all required fields'); return;
  }

  const body = { title, type, location, employmentType, vacancies: parseInt(vacancies) };

  if (editId) {
    await api(`/api/jobs/${editId}`, { method: 'PUT', body: JSON.stringify(body) });
    showToast('Job updated successfully');
  } else {
    await api('/api/jobs', { method: 'POST', body: JSON.stringify(body) });
    showToast('Job added successfully');
  }

  closeModal();
  loadJobs();
}

async function deleteJob(id) {
  if (!confirm('Delete this job listing permanently?')) return;
  await api(`/api/jobs/${id}`, { method: 'DELETE' });
  showToast('Job deleted');
  loadJobs();
}

// Auto-login check
if (token) {
  showDashboard();
  loadJobs();
}
</script>
</body>
</html>
