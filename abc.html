<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purr-fect Essay Converter & Quiz</title>
    <style>
        :root {
            --primary: #ff8a65;
            --primary-hover: #f4511e;
            --bg: #fff8f5;
            --card-bg: #ffffff;
            --text: #37474f;
            --correct: #4caf50;
            --incorrect: #f44336;
            --border: #eceff1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #78909c;
            font-size: 1.1rem;
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(255, 138, 101, 0.1);
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        input[type="url"] {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #b0bec5;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        .essay-section h2 {
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .essay-content {
            background: #fafafa;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            white-space: pre-wrap;
            margin-bottom: 2rem;
        }

        .question-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            background: #fff;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            padding: 0.8rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-item:hover:not(.disabled) {
            background-color: #fff3e0;
            border-color: var(--primary);
        }

        .option-item.correct {
            background-color: #e8f5e9 !important;
            border-color: var(--correct) !important;
            color: #2e7d32;
            font-weight: 600;
        }

        .option-item.incorrect {
            background-color: #ffebee !important;
            border-color: var(--incorrect) !important;
            color: #c62828;
        }

        .option-item.disabled {
            cursor: not-allowed;
        }

        .explanation {
            margin-top: 1rem;
            padding: 1rem;
            background-color: #efebe9;
            border-radius: 8px;
            font-size: 0.95rem;
            border-left: 4px solid #795548;
            display: none;
        }

        .explanation.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🐾 Purr-fect Essay Cat-ifier</h1>
            <p>Paste an essay link, get a cat-themed version, and test your knowledge!</p>
        </header>

        <div class="card">
            <label for="essay-url" style="font-weight: 600;">Enter Essay URL:</label>
            <div class="input-group">
                <input type="url" id="essay-url" placeholder="https://example.com/my-essay" required>
                <button id="generate-btn" onclick="handleGenerate()">Cat-ify! 🐱</button>
            </div>
        </div>

        <div id="loader" class="loader">
            🐱 Fetching, scratching, and converting your essay... Meow-ment please!
        </div>

        <div id="output-section" class="hidden">
            <div class="card essay-section">
                <h2>😸 Your Cat-ified Essay</h2>
                <div id="essay-text" class="essay-content"></div>
            </div>

            <div class="card">
                <h2 style="color: var(--primary); margin-bottom: 1.5rem;">🐾 Pop Quiz</h2>
                <div id="quiz-container"></div>
            </div>
        </div>
    </div>

    <script>
        // --- BACKEND API SIMULATION ---
        // Replace this function logic with your real API fetch calls
        async function fetchCatifiedData(url) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve({
                        catEssay: "The industrial revo-mew-tion and its con-sequences have been a disaster for the human race, but fantastic for feline naps. While humans built factories, cats perfected the art of knocking cups off manufacturing tables. Meow-over, the rise of automated machines meant fewer mice in urban attics, leading to a dramatic shift in feline hunting tactics. Purr-haps the most notable change was the widespread availability of cozy yarn factories, a golden era for kittens everywhere...",
                        questions: [
                            {
                                id: 1,
                                question: "According to the cat-ified text, what was a consequence of automated machines?",
                                options: [
                                    "Fewer mice in urban attics.",
                                    "More jobs for humans.",
                                    "A global shortage of catnip.",
                                    "Cats learning how to drive factories."
                                ],
                                correctAnswerIndex: 0,
                                explanation: "The text explicitly mentions that automated machines led to fewer mice in urban attics, altering feline hunting tactics."
                            },
                            {
                                id: 2,
                                question: "What did cats perfect during the industrial revo-mew-tion?",
                                options: [
                                    "The assembly line system.",
                                    "Knocking cups off manufacturing tables.",
                                    "Catching birds at high speeds.",
                                    "Sleeping exactly 23 hours a day."
                                ],
                                correctAnswerIndex: 1,
                                explanation: "The text humorously states that cats perfected the art of knocking cups off manufacturing tables while humans built factories."
                            }
                        ]
                    });
                }, 2000); // Simulating a 2-second API response delay
            });
        }
        // --------------------------------

        async function handleGenerate() {
            const urlInput = document.getElementById('essay-url').value;
            const generateBtn = document.getElementById('generate-btn');
            const loader = document.getElementById('loader');
            const outputSection = document.getElementById('output-section');

            if (!urlInput) {
                alert('Please enter a valid URL first!');
                return;
            }

            // UI State: Loading
            generateBtn.disabled = true;
            loader.style.display = 'block';
            outputSection.classList.add('hidden');

            try {
                // Call API
                const data = await fetchCatifiedData(urlInput);

                // Render Essay
                document.getElementById('essay-text').innerText = data.catEssay;

                // Render Quiz
                renderQuiz(data.questions);

                // UI State: Success
                outputSection.classList.remove('hidden');
            } catch (error) {
                alert('Oops! Something went wrong generating your cat essay.');
                console.error(error);
            } finally {
                loader.style.display = 'none';
                generateBtn.disabled = false;
            }
        }

        function renderQuiz(questions) {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; // Clear previous quiz if any

            questions.forEach((q, qIndex) => {
                const qCard = document.createElement('div');
                qCard.className = 'question-card';

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerText = `Q${qIndex + 1}: ${q.question}`;
                qCard.appendChild(qText);

                const optionsList = document.createElement('ul');
                optionsList.className = 'options-list';

                q.options.forEach((option, oIndex) => {
                    const oItem = document.createElement('li');
                    oItem.className = 'option-item';
                    oItem.innerText = option;
                    
                    // Click handler for option selection
                    oItem.onclick = () => handleOptionClick(oItem, oIndex, q.correctAnswerIndex, optionsList, qIndex);
                    
                    optionsList.appendChild(oItem);
                });

                qCard.appendChild(optionsList);

                // Explanation Block (hidden by default)
                const explanation = document.createElement('div');
                explanation.id = `explanation-${qIndex}`;
                explanation.className = 'explanation';
                explanation.innerHTML = `<strong>💡 Explanation:</strong> ${q.explanation}`;
                qCard.appendChild(explanation);

                container.appendChild(qCard);
            });
        }

        function handleOptionClick(selectedItem, selectedIdx, correctIdx, optionsList, qIndex) {
            const siblings = optionsList.querySelectorAll('.option-item');
            
            // Prevent changing answer after clicking once
            if(selectedItem.classList.contains('disabled')) return;

            siblings.forEach((el, index) => {
                el.classList.add('disabled'); // Disable all options for this question
                
                if (index === correctIdx) {
                    el.classList.add('correct'); // Highlighting the correct one green
                }
            });

            // If user's choice was wrong, turn it red
            if (selectedIdx !== correctIdx) {
                selectedItem.classList.add('incorrect');
            }

            // Reveal explanation
            const expDiv = document.getElementById(`explanation-${qIndex}`);
            expDiv.classList.add('show');
        }
    </script>
</body>
</html>
